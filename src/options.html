<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>去識別化（CKIP）設定</title>
    <link rel="stylesheet" href="options.css" />
    <script type="module" src="options.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1 id="name">去識別化（CKIP）</h1>
        <p class="muted">在本機把人名、地名、機構、日期等換成代號。不連網，不保存收到的文字。</p>
      </header>

      <section>
        <h2>狀態</h2>
        <dl class="grid">
          <dt>版本</dt><dd id="version"></dd>
          <dt>協定</dt><dd id="protocol"></dd>
          <dt>擴充功能 ID</dt><dd><code id="ext-id"></code></dd>
          <dt>模型</dt><dd><span id="model-state" class="pill"></span> <button id="load" type="button">載入模型</button></dd>
        </dl>
        <p id="model-error" class="error" hidden></p>
      </section>

      <section>
        <h2>呼叫者核准</h2>
        <p class="muted">其他擴充功能第一次呼叫時會列在「待核准」。確認是你信任的擴充功能後再允許；可到 chrome://extensions 比對 ID。</p>
        <h3>待核准</h3>
        <ul id="pending" class="list"></ul>
        <h3>已核准</h3>
        <ul id="approved" class="list"></ul>
      </section>

      <section>
        <h2>信心門檻</h2>
        <p class="muted">模型信心低於門檻的實體仍會替換，但會回報給呼叫端，請使用者確認。</p>
        <form id="threshold-form" class="row">
          <input id="threshold" type="number" min="0" max="1" step="0.05" required />
          <button type="submit">儲存</button>
          <span id="threshold-saved" class="muted" hidden>已儲存</span>
        </form>
      </section>

      <section>
        <h2>測試</h2>
        <p class="muted">貼一段文字看替換結果。只在記憶體處理，不保存。</p>
        <textarea id="test-input" rows="5" placeholder="例如：王小明於 2023 年 3 月 5 日在台中榮民總醫院就診。"></textarea>
        <div class="row"><button id="test-run" type="button">執行</button></div>
        <pre id="test-output" hidden></pre>
      </section>
    </main>
  </body>
</html>
