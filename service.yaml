id: deid-ckip
name: 去識別化（CKIP）
description: 在本機用 CKIP 中文 NER 模型把人名、地名、機構、日期等換成一致代號，供其他擴充功能透過 deid@1 協定呼叫。
version: 0.1.0
protocol: deid@1
license: GPL-3.0

extension:
  id: fdchmnlidiijkhofoemcmpepibdnmgli
  key: 

model:
  source: ckiplab/albert-tiny-chinese-ner
  format: onnx
  quantize: none            # int8 實測標籤一致率僅 88.5%，見 scripts/convert-model.py
  tokenizer: bert-base-chinese

entity_types: [PERSON, GPE, LOC, ORG, FAC, NORP, DATE, TIME]
max_chars_per_request: 20000
